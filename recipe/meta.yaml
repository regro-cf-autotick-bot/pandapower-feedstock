{% set name = "pandapower" %}
{% set version = "3.3.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3e97c2e050aaba372998b7db0e9a793937ed90d327d6f949048c404c13c236eb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - deepdiff
    - networkx >=2.5
    - numpy
    - packaging
    - pandas >=1.0
    - scipy <1.14
    - tqdm
    - geojson
    - lxml
    - typing_extensions ~=4.9

test:
  imports:
    - pandapower
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://www.pandapower.org
  summary: An easy to use open source tool for power system modeling, analysis and optimization with a high degree of automation.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - TonyXiang8787
    - kyri-petrou
